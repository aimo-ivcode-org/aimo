aimo:
  data-dir: ./data/conversations
  global-user-id: global

  # ChatScope Configuration (Phase 2 feature) - ANNOTATION BASED
  #
  # IMPORTANT: Scopes are AUTO-DISCOVERED from @ChatService annotations.
  # Tools and system messages are defined in code, not YAML.
  #
  # Example code patterns:
  #   @ChatService(scope = ["admin"])
  #   class AdminTools { @Tool fun delete() {...} }
  #
  #   @ChatService  // No scope = available in all scopes
  #   class GlobalTools { @Tool fun help() {...} }
  #
  # YAML Configuration is for METADATA ONLY:
  # - display-name: Human-readable scope name
  # - description: Scope description
  # - system-messages: Custom inline system messages for this scope (Map<id, prompt>)
  #
  # The built-in 'global' scope is always available with all tools.

  scope:
    research:
      display-name: "Research Assistant"
      description: "Research and analysis capabilities"
      system-messages:
        research_guide: |
          You are a research expert specializing in data analysis and academic research.
          Focus on accuracy, citations, and evidence-based reasoning.
          Always distinguish between established facts and speculative analysis.

    public:
      display-name: "Public Assistant"
      description: "General purpose assistant for public use"
      system-messages:
        public_guide: |
          You are a helpful, friendly assistant available to the public.
          Keep responses clear, accessible, and appropriate for a general audience.
          Avoid technical jargon unless explaining it.

    admin:
      display-name: "Admin Tools"
      description: "Administrative operations (restricted access)"

  model:
    ollama:
      gpt-oss:
        base-url: http://localhost:11434
        primary: true
        options:
          model: gpt-oss:20b
          temperature: 0.7

  interceptors:
    logging:
      enabled: true
      level: INFO
    tracing:
      enabled: false
    error-handling:
      enabled: false





