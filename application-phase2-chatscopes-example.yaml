aimo:
  data-dir: ./data/conversations
  global-user-id: global

  # ChatScope Configuration (Phase 2 feature) - ANNOTATION BASED WITH CONFIG OVERRIDE
  #
  # Scopes are AUTO-DISCOVERED from @ChatService annotations:
  #   @ChatService(scope = ["admin"])
  #   class AdminTools { @Tool fun delete() {...} }
  #
  #   @ChatService  // No scope = global (available in all scopes)
  #   class GlobalTools { @Tool fun help() {...} }
  #
  # YAML Configuration allows:
  # - display-name: Scope display name
  # - description: Scope description
  # - inherit-global: Include global tools (default: true)
  # - tool-refs: Explicitly add/restrict specific tools
  # - system-messages: Custom inline system messages
  # - system-message-refs: Include pre-defined @SystemMessage beans
  #
  # Key Concept:
  # - inheritGlobal=true (default): Scope includes global tools + annotation-scoped tools
  # - inheritGlobal=false: Scope includes ONLY annotation-scoped tools (no globals)

  scope:
    # Normal scope: includes global tools + research-specific tools
    research:
      display-name: "Research Assistant"
      description: "Research and analysis capabilities"
      inherit-global: true  # Include help, status, etc
      tool-refs: ["search", "summarize"]  # Plus these research tools
      system-messages:
        research_guide: |
          You are a research expert specializing in data analysis and academic research.
          Focus on accuracy, citations, and evidence-based reasoning.

    # Restricted scope: isolated from global tools
    restricted_admin:
      display-name: "Restricted Admin"
      description: "Admin-only with no helper tools"
      inherit-global: false  # Don't include global tools
      tool-refs: ["delete_user", "ban_ip"]  # Only these admin tools
      system-messages:
        admin_warning: |
          You have restricted admin access. Be careful with these operations.
          All actions are logged.

    # Regular admin scope: includes both global and admin tools
    admin:
      display-name: "Admin Tools"
      description: "Administrative operations (with helpers)"
      inherit-global: true  # Include help, status, etc
      system-messages:
        admin_guide: "You have full administrative access."

    # Public scope
    public:
      display-name: "Public Assistant"
      description: "General purpose assistant for public use"
      inherit-global: true
      system-messages:
        public_guide: |
          You are a helpful, friendly assistant available to the public.
          Keep responses clear and accessible.

  model:
    ollama:
      gpt-oss:
        base-url: http://localhost:11434
        primary: true
        options:
          model: gpt-oss:20b
          temperature: 0.7

  interceptors:
    logging:
      enabled: true
      level: INFO
    tracing:
      enabled: false
    error-handling:
      enabled: false





