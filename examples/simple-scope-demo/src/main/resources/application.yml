spring:
  application:
    name: simple-scope-demo

server:
  port: 8080

aimo:
  # Conversation storage directory
  data-dir: ./data/conversations

  # Single-user mode
  global-user-id: demo-user

  # Ollama model configuration
  model:
    ollama:
      demo-model:
        base-url: http://localhost:11434
        primary: true
        options:
          model: mistral  # or whatever model you have in Ollama
          temperature: 0.7

  # ChatScope Configuration - showing inherit-global and cherry-picking patterns
  scope:
    # Default scopes (inherit-global: true by default)
    public:
      display-name: "Public Scope"
      description: "General-purpose tools with global helpers"

    admin:
      display-name: "Admin Scope"
      description: "Administrative tools with global helpers"

    research:
      display-name: "Research Scope"
      description: "Research tools with global helpers"

    # Use Case 1: Isolated scope without global tools
    restricted:
      display-name: "Restricted Scope (No Globals)"
      description: "Only specific tools - no global helper tools"
      inherit-global: false
      tool-refs: ["deleteConversation", "banUser"]

    # Use Case 2: Cherry-pick tools from multiple scopes
    power_user:
      display-name: "Power User (Mixed Tools)"
      description: "Cherry-picked tools from public, admin, and research scopes"
      inherit-global: true
      tool-refs:
        - "add"                    # From public
        - "multiply"               # From public
        - "deleteConversation"     # From admin
        - "searchPapers"           # From research

  # Interceptors (optional)
  interceptors:
    logging:
      enabled: false
    tracing:
      enabled: false
    error-handling:
      enabled: false

logging:
  level:
    org.ivcode.aimo: DEBUG
    org.springframework: INFO





